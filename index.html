<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="双端 B 站推送方案 —— Standalone 独立服务或 Koishi 子插件接入，把直播、动态、Super Chat、大航海变成精美的推送卡片，实时送达 Discord / QQ / Telegram。"
    />
    <title>Bilibili Notify — 让 UP 主动态不再错过</title>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('bn-theme');
          const choice =
            raw === 'light' || raw === 'dark' || raw === 'system' ? raw : 'system';
          const resolved =
            choice === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : choice;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
